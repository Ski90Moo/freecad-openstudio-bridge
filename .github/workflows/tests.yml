# The suite runs on three operating systems, not because the bridge is used on
# three, but because it has only ever been *run* on one.  The Python is meant
# to be platform-independent and the README says so; this is what turns that
# from a belief into a checked fact.  Case-sensitive filesystems and path
# separators are where Windows-only code usually breaks first.
#
# What this cannot cover: anything needing FreeCAD's geometry kernel.  There is
# no FreeCAD on a runner, so the fc_*.py side and tests/test_pitched_faces.py
# skip here and are exercised by hand under FreeCAD's own interpreter.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform reports, rather than the first failure hiding the rest --
      # which matters most when the question being asked *is* "which platform".
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Not ceremony.  Every openstudio test raises SkipTest when the import
      # fails, so a runner missing a shared library the wheel needs would skip
      # its way to a green tick and the badge would mean nothing.  This fails
      # loudly instead.
      - name: Check openstudio actually imports
        run: python -c "import openstudio; print('openstudio', openstudio.openStudioLongVersion())"

      - name: Run the suite
        run: python -m unittest discover -s tests -v

      # The unit tests exercise the pieces in isolation and never touch
      # samples/.  This builds the whole sample model end to end -- the
      # heaviest path in the repo, and the one where a platform difference
      # would actually surface.  It also pins the numbers the README quotes,
      # so they cannot drift unnoticed.
      #
      # It starts from samples/plan.json rather than the .FCStd because the
      # export is FreeCAD's half and no runner has FreeCAD.  The floorplan
      # JSON is the seam between the two halves, which makes it exactly the
      # right place to pick the pipeline up.
      - name: Build the sample model
        shell: bash
        run: |
          python build_osm_geometry.py samples/plan.json --out demo.osm

          # The one fire-rated wall declares itself: OS_AirBoundaryOverride
          # rides on the wall's own sketch edge in FloorplanTest-05.FCStd, and
          # fc_export_floorplan.py resolves it into samples/plan.json at
          # export time, so find_air_boundaries.py picks it up automatically
          # here with no --solid-surface flag needed. That is the point of
          # tagging over naming a surface by hand: a surface name is
          # positional and rots on any rebuild that renumbers surfaces; the
          # tag survives one. test_the_fire_wall_stayed_solid still checks
          # the result -- if the tag itself is ever lost, that is what fails.
          python find_air_boundaries.py demo.osm samples/plan.json \
            --apply-json --out boundaries.json
          python apply_air_boundaries.py demo.osm boundaries.json --out demo.osm

          python - <<'PY'
          import openstudio
          model = openstudio.osversion.VersionTranslator().loadModel(
              openstudio.path("demo.osm")).get()
          got = (len(model.getSpaces()), len(model.getSurfaces()),
                 len(model.getBuildingStorys()), len(model.getThermalZones()))
          print("spaces %d  surfaces %d  stories %d  zones %d" % got)
          assert got == (36, 326, 3, 36), "built model does not match the README"

          # Without this the air-boundary invariant tests below would iterate
          # an empty list and pass while testing nothing -- the same silent
          # green the openstudio import check exists to prevent.
          boundaries = len(model.getConstructionAirBoundarys())
          print("air-boundary constructions: %d" % boundaries)
          assert boundaries == 6, "expected 6 air boundaries, got %d" % boundaries
          print("matches the README")
          PY

      # Re-run the invariants against the model just built.  Without
      # BRIDGE_TEST_OSM these four skip for want of a model, which is how they
      # came to run only on the author's desk.
      - name: Check the built model's air boundaries
        shell: bash
        env:
          BRIDGE_TEST_OSM: demo.osm
        run: |
          python -m unittest -v \
            tests.test_air_boundary_sizing.TestAppliedModelInvariants
